<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Widget DOM Snapshot Options</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-width: 320px;
        margin: 0;
        background: #f7faf9;
        color: #17211f;
      }

      main {
        display: grid;
        gap: 14px;
        padding: 16px;
      }

      h1 {
        margin: 0;
        font-size: 15px;
        line-height: 1.2;
      }

      label {
        display: grid;
        gap: 6px;
        color: #52605b;
        font-size: 12px;
        font-weight: 700;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #b8c8c3;
        border-radius: 8px;
        padding: 9px 10px;
        color: #17211f;
        font: inherit;
      }

      input:focus {
        border-color: #147d6f;
        outline: 2px solid rgba(20, 125, 111, 0.16);
      }

      .actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      button {
        border: 1px solid #b8c8c3;
        border-radius: 8px;
        background: #ffffff;
        color: #263532;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 8px 10px;
      }

      button.primary {
        border-color: #147d6f;
        background: #147d6f;
        color: #ffffff;
      }

      #status {
        min-height: 16px;
        color: #52605b;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Codex Widget DOM Snapshot</h1>
      <label for="daemon-url">
        Daemon snapshot URL
        <input id="daemon-url" spellcheck="false" />
      </label>
      <div class="actions">
        <button id="reset" type="button">Reset</button>
        <button id="save" class="primary" type="button">Save</button>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
