<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Widget Browser Bridge</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        width: 320px;
        margin: 0;
        background: #f7faf9;
        color: #17211f;
      }

      main {
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: 15px;
        line-height: 1.2;
      }

      #badge {
        min-width: 44px;
        border-radius: 999px;
        padding: 4px 8px;
        background: #dfe8e5;
        color: #263532;
        font-size: 11px;
        font-weight: 800;
        text-align: center;
      }

      section {
        display: grid;
        gap: 8px;
        border: 1px solid #d5e2dd;
        border-radius: 10px;
        padding: 10px;
        background: #ffffff;
      }

      .status {
        display: grid;
        gap: 4px;
        font-size: 12px;
      }

      .status strong {
        color: #147d6f;
        font-size: 13px;
      }

      .muted {
        color: #61716b;
      }

      label {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        font-weight: 700;
      }

      input[type="text"],
      input[type="number"],
      textarea {
        grid-column: 1 / -1;
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #b8c8c3;
        border-radius: 8px;
        padding: 8px 9px;
        color: #17211f;
        font: inherit;
      }

      textarea {
        min-height: 54px;
        resize: vertical;
      }

      input:focus,
      textarea:focus {
        border-color: #147d6f;
        outline: 2px solid rgba(20, 125, 111, 0.16);
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      button {
        min-height: 30px;
        border: 1px solid #b8c8c3;
        border-radius: 8px;
        background: #ffffff;
        color: #263532;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        font-weight: 800;
        padding: 7px 9px;
      }

      button.primary {
        border-color: #147d6f;
        background: #147d6f;
        color: #ffffff;
      }

      #status {
        min-height: 16px;
        color: #52605b;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Browser Bridge</h1>
        <div id="badge">OFF</div>
      </header>

      <section class="status">
        <strong id="connection">Checking...</strong>
        <span id="tab-state" class="muted">Current tab status unavailable.</span>
        <span id="diagnostic" class="muted"></span>
      </section>

      <section>
        <label for="daemon-base-url">
          Daemon base URL
          <input id="daemon-base-url" type="text" spellcheck="false" />
        </label>
        <div class="actions">
          <button id="test-connection" type="button">Test</button>
          <button id="save" class="primary" type="button">Save</button>
          <button id="enable-site" type="button">Enable site</button>
          <button id="reset" type="button">Reset</button>
        </div>
      </section>

      <section>
        <label>
          Auto-connect
          <input id="auto-connect" type="checkbox" />
        </label>
        <label>
          Share current page context
          <input id="auto-observe" type="checkbox" />
        </label>
        <label>
          Allow all sites except blocklist
          <input id="allow-all-sites" type="checkbox" />
        </label>
        <label for="observe-blocklist">
          Observe blocklist
          <textarea id="observe-blocklist" spellcheck="false" placeholder="example.com&#10;https://private.example"></textarea>
        </label>
        <button id="toggle-current-site-block" type="button">Block current site</button>
        <label>
          Allow safe read/scroll
          <input id="allow-safe-read-scroll" type="checkbox" />
        </label>
        <label>
          Require approval for click/type
          <input id="require-approval-click-type" type="checkbox" />
        </label>
        <label>
          Native host fallback
          <input id="native-host" type="checkbox" />
        </label>
      </section>

      <section>
        <label for="poll-interval">
          Poll interval seconds
          <input id="poll-interval" type="number" min="5" max="120" step="1" />
        </label>
        <label>
          Debug page capture
          <input id="debug-snapshot" type="checkbox" />
        </label>
        <button id="debug-capture" type="button">Run debug capture</button>
      </section>

      <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
