[package]
name = "codex-browser-native-desktop-helper"
version = "0.1.0"
edition = "2024"
description = "Bounded Windows UI Automation helper for Codex Widget Browser Action"
license = "UNLICENSED"

[[bin]]
name = "browser-native-desktop-helper"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.37"
uiautomation = { version = "0.25.0", default-features = true }
