[package]
name = "codex-widget-for-desktop"
version = "0.1.0"
description = "A resident Codex-style desktop widget"
authors = ["Tony"]
edition = "2021"

[lib]
name = "codex_widget_for_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
